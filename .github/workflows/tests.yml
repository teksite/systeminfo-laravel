
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Testbench ${{ matrix.testbench }} - ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # Laravel 12 - Ubuntu
          - os: ubuntu-latest
            php: '8.3'
            laravel: '12.*'
            testbench: '^10.0'

          - os: ubuntu-latest
            php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'

          # Laravel 12 - Windows
          - os: windows-latest
            php: '8.3'
            laravel: '12.*'
            testbench: '^10.0'

          - os: windows-latest
            php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'

          # Laravel 13 - Ubuntu
          - os: ubuntu-latest
            php: '8.3'
            laravel: '13.*'
            testbench: '^11.0'

          - os: ubuntu-latest
            php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'

          # Laravel 13 - Windows
          - os: windows-latest
            php: '8.3'
            laravel: '13.*'
            testbench: '^11.0'

          - os: windows-latest
            php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Configure dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Audit dependencies
        run: composer audit --no-interaction
